name: Design alignment check

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "AGENTS.md"
      - ".github/prompts/design-check.prompt.md"
      - ".github/workflows/design-check.yml"
  pull_request:
    paths:
      - "src/**"
      - "AGENTS.md"
      - ".github/prompts/design-check.prompt.md"
      - ".github/workflows/design-check.yml"
  workflow_dispatch:

concurrency:
  group: design-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node (for figma-developer-mcp via npx)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run design alignment check
        uses: anthropics/claude-code-base-action@beta
        env:
          FIGMA_API_KEY: ${{ secrets.FIGMA_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Read AGENTS.md and follow the design-check task exactly:

            1. List components in src/components/ and read each one's .tsx + .module.css.
            2. Read src/tokens.css and src/pages/home/index.tsx (+ its CSS).
            3. Use the `figma` MCP `get_figma_data` tool with
               fileKey "i3MTtBKiPbLq7bEIJqL4yc". Start at node 0-1 to discover
               frames, then drill into component frames by nodeId. Never fetch
               the whole file without a nodeId.
            4. Compare the three groups defined in AGENTS.md.
            5. Overwrite design-alignment-report.md at the repo root using the
               exact format from AGENTS.md.
            6. Do not modify any other files.
          allowed_tools: "Read,Write,Edit,Glob,Grep,mcp__figma__get_figma_data"
          mcp_config: |
            {
              "mcpServers": {
                "figma": {
                  "command": "npx",
                  "args": ["-y", "figma-developer-mcp", "--stdio"],
                  "env": {
                    "FIGMA_API_KEY": "${FIGMA_API_KEY}"
                  }
                }
              }
            }

      - name: Commit report (push to main)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if [[ -z "$(git status --porcelain design-alignment-report.md)" ]]; then
            echo "No changes to design-alignment-report.md"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design-alignment-report.md
          git commit -m "chore: update design alignment report [skip ci]"
          git push

      - name: Commit report (pull request)
        if: github.event_name == 'pull_request'
        run: |
          if [[ -z "$(git status --porcelain design-alignment-report.md)" ]]; then
            echo "No changes to design-alignment-report.md"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design-alignment-report.md
          git commit -m "chore: update design alignment report"
          git push origin HEAD:${{ github.head_ref }}
